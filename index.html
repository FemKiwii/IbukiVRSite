<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iBukiVR | Links</title>
    <meta name="description" content="iBukiVR — music loving elf. All my links in one place.">

    <!-- Fonts: italic display serif for the name, clean sans for everything else -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Blurred background image, set via CONFIG.backgroundImage in script.js -->
    <div class="bg-layer" id="bg-layer"></div>
    <div class="bg-overlay"></div>

    <main class="container">

        <!-- Header: avatar, name, tag pills, bio -->
        <header>
            <div class="avatar-wrap">
                <img id="avatar" class="avatar" src="" alt="Profile picture">
                <img id="badge" class="badge" src="" alt="" hidden>
            </div>

            <h1 id="name" class="name"></h1>

            <div id="tags" class="tags"></div>

            <div id="bio" class="bio"></div>
        </header>

        <!-- Socials card: small icon row + optional live status line -->
        <section class="socials-card" id="socials-card">
            <div class="socials-label">SOCIALS</div>
            <div class="socials-row" id="socials-row"></div>

            <div class="status-row" id="status-row" hidden>
                <img class="status-avatar" id="status-avatar" src="" alt="">
                <div class="status-text">
                    <span class="status-handle" id="status-handle"></span>
                    <span class="status-line">
                        <span class="status-dot" id="status-dot"></span>
                        <span id="status-label"></span>
                    </span>
                </div>
            </div>
        </section>

        <!-- Link rows + section dividers, all injected by script.js -->
        <section class="links-wrapper" id="links-wrapper"></section>

        <footer>
            <p id="footer-text"></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
