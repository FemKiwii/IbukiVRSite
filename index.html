<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iBukiVR | Links</title>
    <meta name="description" content="iBukiVR — music loving elf. All my links in one place.">
    <meta name="theme-color" content="#030B16">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://cdn.discordapp.com https://i.scdn.co; connect-src 'self' https://api.lanyard.rest; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="canonical" href="https://ibukivr.vercel.app/">
    <link rel="icon" type="image/png" href="IbukiLogo.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Open Graph / Twitter card so shared links show a preview -->
    <meta property="og:title" content="iBukiVR | Links">
    <meta property="og:description" content="iBukiVR — music loving elf. All my links in one place.">
    <meta property="og:image" content="IbukiLogo.png">
    <meta property="og:image:width" content="1920">
    <meta property="og:image:height" content="780">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Fonts: italic display serif for the name, clean sans for everything else -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- Preload the optimized background + logo so they paint as early as possible -->
    <link rel="preload" as="image" href="Background1920w.webp" type="image/webp">
    <link rel="preload" as="image" href="IbukiLogo.webp" type="image/webp">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Blurred background image, set via CONFIG.backgroundImage in script.js -->
    <div class="bg-layer" id="bg-layer"></div>
    <div class="bg-overlay"></div>
    <div class="bg-crt"></div>
    <canvas id="bg-stars"></canvas>

    <!-- Intro splash — click/tap anywhere to enter. This real user gesture
         also lets the music start unmuted properly, instead of relying on
         the muted-autoplay trick. -->
    <div class="intro-splash" id="intro-splash" role="button" tabindex="0" aria-label="Enter site">
        <p class="intro-text" id="intro-text"></p>
        <p class="intro-subtext">tap anywhere to come in ♡</p>
    </div>

    <!-- Ambient background music player. Add your own file at
         audio/background-music.mp3 to enable — the player auto-disables
         itself if that file isn't there yet. Tries to autoplay on load;
         browsers that block that will start it on the visitor's first
         click/tap anywhere on the page instead. -->
    <audio id="bg-audio" loop preload="auto">
        <source src="audio/background-music.mp3" type="audio/mpeg">
    </audio>
    <div class="music-player" id="music-player">
        <button type="button" id="music-playpause" class="music-btn" aria-label="Play or pause background music" aria-pressed="false">▶</button>
        <button type="button" id="music-stop" class="music-btn" aria-label="Stop background music">⏹</button>
        <input type="range" id="music-volume" class="music-volume" min="0" max="100" value="15" aria-label="Music volume">
        <div class="music-progress" id="music-progress"><div class="music-progress-fill" id="music-progress-fill"></div></div>
    </div>


    <main class="container">

        <!-- Header: avatar, name, tag pills, bio -->
        <header>
            <div class="avatar-wrap">
                <img id="avatar" class="avatar" src="" alt="iBukiVR logo" width="1920" height="780">
                <img id="badge" class="badge" src="" alt="iBuki avatar" width="210" height="210" hidden>
            </div>

            <h1 id="name" class="name"></h1>
            <p id="greeting" class="greeting"></p>

            <div id="tags" class="tags"></div>

            <div id="bio" class="bio">
                <p class="bio-line"><span id="bio-typed" aria-hidden="true"></span><span class="bio-cursor" aria-hidden="true">▍</span></p>
                <span id="bio-sr" class="sr-only"></span>
            </div>
            <div class="quick-copy-row" id="quick-copy-row"></div>
        </header>

        <!-- Socials card: small icon row + optional live status line -->
        <section class="socials-card" id="socials-card">
            <div class="socials-header">
                <div class="socials-label">SOCIALS</div>
                <button type="button" class="share-btn" id="share-btn" aria-label="Copy or share this page">
                    <span id="share-btn-label">Share ↗</span>
                </button>
            </div>
            <div class="socials-row" id="socials-row"></div>

            <div class="status-row" id="status-row" hidden>
                <img class="status-avatar" id="status-avatar" src="" alt="">
                <div class="status-text">
                    <span class="status-handle" id="status-handle"></span>
                    <span class="status-line">
                        <span class="status-dot" id="status-dot"></span>
                        <span id="status-label"></span>
                    </span>
                </div>
            </div>
        </section>

        <!-- Link rows + section dividers, all injected by script.js -->
        <section class="links-wrapper" id="links-wrapper"></section>

        <footer>
            <p id="footer-text"></p>
        </footer>
    </main>

    <!-- Age verification modal, shown before opening any 18+ link -->
    <div class="age-gate-overlay" id="age-gate-overlay" hidden>
        <div class="age-gate-card" role="dialog" aria-modal="true" aria-labelledby="age-gate-title">
            <h2 id="age-gate-title">Age Verification</h2>
            <p class="age-gate-text">This link leads to 18+ content. Please confirm your date of birth to continue.</p>
            <label class="age-gate-label" for="age-gate-dob">Date of birth</label>
            <input type="date" id="age-gate-dob" class="age-gate-input">
            <p class="age-gate-error" id="age-gate-error" aria-live="polite"></p>
            <div class="age-gate-actions">
                <button type="button" id="age-gate-cancel" class="age-gate-btn age-gate-btn-cancel">Cancel</button>
                <button type="button" id="age-gate-confirm" class="age-gate-btn age-gate-btn-confirm">Continue</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
